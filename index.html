<body>
<h2>Volunteer Form</h2>
<form action="http://bloomingdale.sat.iit.edu/kriedan/lab3formscript.php" method="post">
    <fieldset>
        <legend>My Info </legend>

        <label for="fname">first name: </label>
        <input type="text" id="fname" name="first_name_field" style="width: 85%;">
        <br>
        <label for="fname">last name:</label>
        <input type="text" id="fname" name="last_name_field" style="width: 85%;">
        <br>
        <label for="phone">phone:</label>
        <input type="tel" id="phone" name="phone_field" pattern="[0-9]{3}-?[0-9]{3}-?[0-9]{4}" style="width: 89%;">
        <br>
        <label for="email">email:</label>
        <input type="email" id="email" name="email_field" style="width: 89%;">
        <br>

        <label for="cars">Gender:</label><br>
            <label for="html">Male:</label>
            <input type="radio" id="html" name="gender_field" value="HTML">
            <label for="css">Female</label>
            <input type="radio" id="male" name="gender_field" value="male"><br>
        
        <label for="cars">Age:</label><br>
            <select id="cars" name="age_field">
            <option value="volvo">Under 18</option>
            <option value="saab">Over 18</option>
            </select>
    </fieldset>
    <fieldset>
        <legend>My Availability</legend>

        <h4>Days Available:</h4>
        <label for="vehicle1">Monday</label>
        <input type="checkbox" id="day1" name="available_field[]" value="Bike"><br>
        <label for="vehicle2">Tuesday</label>
        <input type="checkbox" id="day2" name="available_field[]" value="Car"><br>
        <label for="vehicle3">Wednesday</label>
        <input type="checkbox" id="day3" name="available_field[]" value="Boat"><br>
        <label for="vehicle3">Thursday</label>
        <input type="checkbox" id="day4" name="available_field[]" value="Boat"><br>
        <label for="vehicle3">Friday</label>
        <input type="checkbox" id="day5" name="available_field[]" value="Boat"><br>
        <label for="vehicle3">Saturday</label>
        <input type="checkbox" id="day6" name="available_field[]" value="Boat"><br>
        
        <h4>Comments</h4>
        <textarea id="comments" name="comments_field" rows="4" cols="50"></textarea>    
    </fieldset>
    <br>
    <input type="hidden" name="hidden_field" value="Olivia Kulinski">

    <input type="submit" value="Submit Query">


</form>

<script src=""></script>

</body>
</html>
